services:
  downloader:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DOWNLOAD_BACKEND_TOKEN: ${DOWNLOAD_BACKEND_TOKEN:?Set DOWNLOAD_BACKEND_TOKEN}
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
